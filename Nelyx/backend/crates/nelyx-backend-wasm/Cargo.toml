[package]
name = "nelyx-backend-wasm"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
nelyx-backend-core = { path = "../nelyx-backend-core", version = "=0.1.0" }
serde_json = "1"
wasm-bindgen = "=0.2.128"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
  "Window", "Navigator", "Clipboard", "Permissions", "PermissionStatus",
  "PermissionState", "EventTarget", "Geolocation", "PositionOptions",
] }
