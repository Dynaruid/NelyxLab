[package]
name = "nelyx-skia-foreground"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false

[dependencies]
skia-safe = { version = "=0.99.0", default-features = false, features = ["binary-cache", "no-compile", "pdf", "jpeg"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = [
  "std", "MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer",
  "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat",
  "MTLResource", "MTLTexture", "MTLTypes",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
  "std", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
] }

[package.metadata.nelyx-skia]
source = "https://github.com/rust-skia/skia/tree/90af6f5c5a3ed8788b805fe6ca3fcdf28c2c2bc9"
raster_backend = "skia-cpu-bgra8888-premul-srgb"
frame_wire = "web-frame-v1"
