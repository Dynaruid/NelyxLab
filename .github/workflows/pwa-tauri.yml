name: Build Web and Tauri packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: '1.95.0'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install the Wasm toolchain
        timeout-minutes: 20
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build the pinned CanvasKit runtime from source
        shell: bash
        run: |
          set -euo pipefail
          skia=$(mktemp -d "${RUNNER_TEMP}/nelyx-skia.XXXXXXXX")
          trap 'rm -rf -- "$skia"' EXIT
          revision=$(node -p "require('./Nelyx/skia/eng/source-build/canvaskit.lock.json').skia.revision")
          curl --fail --location --retry 3 --max-time 300 "https://codeload.github.com/google/skia/tar.gz/$revision" --output "$skia/source.tar.gz"
          recipe=Nelyx/skia/eng/source-build/build-canvaskit.py
          timeout --kill-after=10s 1190s python3 "$recipe" prepare --root "$skia/build" --archive "$skia/source.tar.gz"
          jobs=$(nproc)
          if (( jobs > 16 )); then jobs=16; fi
          timeout --kill-after=10s 1190s python3 "$recipe" build --root "$skia/build" --jobs "$jobs"
          node Nelyx/skia/eng/prepare-web-runtime.mjs "$skia/build/out/nelyx-canvaskit"
      - name: Build both targets and verify the shared renderer
        timeout-minutes: 20
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build:sdk
          node Nelyx/eng/check-device-services.mjs
          node Nelyx/eng/check-expanded-device-services.mjs
          sdk=$(mktemp -d "${RUNNER_TEMP}/nelyx-sdk.XXXXXXXX")
          trap 'rm -rf -- "$sdk"' EXIT
          npm run pack:sdk -- "$sdk"
          for app in sample/nelyx-demo-app sample/nelyx-testbed-app-2; do
            node Nelyx/sdk/tooling/cli/src/main.mjs supply --app "$app" --packages "$sdk"
            npm ci --prefix "$app" --workspaces=false --no-audit --no-fund
            cli="$app/node_modules/@nelyx/cli/src/main.mjs"
            node "$cli" build --app "$app" --target web
            node "$cli" build --app "$app" --target tauri --frontend-only
            npm --prefix "$app" run typecheck
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import fs from "node:fs";
              const app = process.argv[1];
              const read = folder => JSON.parse(fs.readFileSync(app + "/.nelyx/" + folder + "/build.json"));
              const web = read("web"), tauri = read("tauri/frontend");
              assert.equal(web.backend.sourceId, tauri.backend.sourceId);
              assert.deepEqual(web.canvasKit, tauri.canvasKit);
              const assets = build => build.files.filter(({path}) => path.startsWith("assets/"));
              assert.deepEqual(assets(web), assets(tauri));
            ' "$app"
          done
          node Nelyx/eng/check-pwa-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: sample/*/.nelyx/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-inputs
          path: |
            sample/*/package.json
            sample/*/package-lock.json
            sample/*/.nelyx/supply/*.tgz
            sample/*/.nelyx/sdk/rust/
            sample/*/.nelyx/tauri/frontend/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, platform: windows, architecture: x64, rust: x86_64-pc-windows-msvc }
          - { runner: ubuntu-24.04, platform: linux, architecture: x64, rust: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04, platform: android, architecture: x64, rust: x86_64-linux-android }
          - { runner: ubuntu-24.04, platform: android, architecture: arm64, rust: aarch64-linux-android }
          - { runner: macos-15, platform: macos, architecture: arm64, rust: aarch64-apple-darwin }
          - { runner: macos-15, platform: ios, architecture: arm64-sim, rust: aarch64-apple-ios-sim }
    runs-on: ${{ matrix.runner }}
    env:
      NELYX_PLATFORM: ${{ matrix.platform }}
      NELYX_ARCHITECTURE: ${{ matrix.architecture }}
      NELYX_RUST_TARGET: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.14904198'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: tauri-inputs
          path: sample
      - name: Install runner and toolchain
        timeout-minutes: 20
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$NELYX_RUST_TARGET"
          rustup default "$RUST_VERSION"
          npm ci --no-audit --no-fund
          for app in sample/nelyx-demo-app sample/nelyx-testbed-app-2; do
            npm ci --prefix "$app" --workspaces=false --no-audit --no-fund
          done
      - name: Generate and package Demo
        timeout-minutes: 20
        shell: bash
        run: npm run pack:tauri --prefix sample/nelyx-demo-app -- --platform "$NELYX_PLATFORM" --architecture "$NELYX_ARCHITECTURE" --frontend .nelyx/tauri/frontend
      - if: matrix.platform == 'windows'
        name: Regenerate and compare Tauri IPC bindings
        timeout-minutes: 20
        run: npm run check:backend-bindings
      - name: Generate and package Testbed
        timeout-minutes: 20
        shell: bash
        run: npm run pack:tauri --prefix sample/nelyx-testbed-app-2 -- --platform "$NELYX_PLATFORM" --architecture "$NELYX_ARCHITECTURE" --frontend .nelyx/tauri/frontend
      - if: matrix.platform == 'windows'
        name: Verify Windows WebView2 assets and Rust IPC
        timeout-minutes: 20
        shell: pwsh
        run: |
          node Nelyx/eng/check-tauri-windows.mjs sample/nelyx-demo-app
          node Nelyx/eng/check-tauri-windows.mjs sample/nelyx-testbed-app-2
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ matrix.architecture }}
          path: sample/*/.nelyx/tauri/${{ matrix.platform }}-${{ matrix.architecture }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
