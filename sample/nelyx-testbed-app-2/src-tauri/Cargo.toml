[package]
name = "nelyx-tauri-app"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.6", features = ["codegen"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.7", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
